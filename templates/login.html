<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-container {
      display: flex;
      background: #ffffff;
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
      max-width: 900px;
      width: 100%;
    }

    .left-section {
      background: #f0f4ff;
      padding: 30px;
      width: 45%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #ddd;
    }

    .left-section img.logo {
      width: 100px;
      height: auto;
      margin-bottom: 20px;
    }

    .left-section h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 20px;
    }

    .left-section img.main-image {
      width: 100%;
      max-width: 250px;
      height: auto;
      border-radius: 6px;
    }

    .right-section {
      padding: 40px;
      width: 55%;
    }

    .right-section h2 {
      text-align: center;
      color: #222;
      margin-bottom: 30px;
      font-size: 32px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #333;
    }

    .form-group i {
      position: absolute;
      left: 12px;
      top: 42px;
      color: #999;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px 12px 35px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: 0.3s ease-in-out;
    }

    .form-group input:focus {
      border-color: #007BFF;
      outline: none;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
    }

    .form-group .toggle-password {
      position: absolute;
      top: 42px;
      right: 12px;
      cursor: pointer;
      color: #999;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .checkbox-group input {
      margin-right: 8px;
      width: auto;
    }

    .checkbox-group label {
      font-size: 14px;
      color: #555;
    }

    .submit-btn {
      width: 100%;
      background: #007BFF;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .submit-btn:hover {
      background: #0056b3;
    }

    .form-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .form-footer a {
      color: #007BFF;
      text-decoration: none;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .left-section, .right-section {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      .right-section {
        padding: 30px;
      }
    }                
  </style>
</head>
<body>
  <div class="main-container">
    <!-- Left Section -->
    <div class="left-section">
      <img src="{{ url_for('static', filename='assets/img/icons/logo.svg') }}" alt="Logo"
           style="width: 400px; height: auto; display: block; margin: 0 auto;" />

      <h2 style="text-align: center; font-weight: bold; font-size: 2rem; 
                  color: #274293; 
                  margin: 20px 0;">
        PRMSC Immoveable Asset Management System
      </h2>

      <img src="{{ url_for('static', filename='assets/img/icons/land.jpg') }}" alt="Land"
           style="width: 80%; height: auto; display: block; margin: 0 auto;" />
    </div>

    <!-- Right Section -->
    <div class="right-section">
      <h4 style="
          background: linear-gradient(to right, #274293, #ffffff);
          color: white;
          padding: 10px;
          font-size: 28px;
          text-align: center;
          border-radius: 8px;
          margin-bottom: 38px;
          line-height: 1.8;
          font-weight: bold;">
        Welcome
      </h4>
      <h2>Sign In</h2>
      <form action="/login" method="POST">
        <!-- Email -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <i class="fa-solid fa-envelope"></i>
          <input type="email" name="email" id="email" placeholder="Enter your email" required />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <i class="fa-solid fa-lock"></i>
          <div class="password-wrapper">
             <input type="password" name="password" id="password" placeholder="Enter your password" required />
             <i class="fa-solid fa-eye toggle-password" onclick="togglePassword()"></i>
          </div>
        </div>

        <!-- Remember Me -->
        <div class="checkbox-group">
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember">Remember me</label>
        </div>

        <!-- Submit -->
        <button type="submit" class="submit-btn">Login</button>
      </form>

      <!-- Footer -->
      <div class="form-footer">
        <p>Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
        <p><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
      </div>
    </div>
  </div>

  <!-- Password Toggle Script -->
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const icon = document.querySelector(".toggle-password");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        passwordInput.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }
  </script>

  <!-- Check for success parameter in URL -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const success = urlParams.get('success');
    const userName = urlParams.get('name');

    if (success === 'true' && userName) {
      Swal.fire({
        icon: 'success',
        title: 'Registration Successful!',
        text: `Welcome ${userName}! Your account has been created successfully.`,
        confirmButtonText: 'Continue to Login',
        confirmButtonColor: '#1f2937'
      });
    }
  </script>
</body>
</html>
