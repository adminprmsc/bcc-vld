<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - Land Donation System</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .forgot-container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
      position: relative;
      overflow: hidden;
    }
    .forgot-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #274293, #667eea);
    }
    .header-section {
      text-align: center;
      margin-bottom: 30px;
    }
    .header-section i {
      font-size: 48px;
      color: #274293;
      margin-bottom: 15px;
    }
    .header-section h2 {
      color: #274293;
      margin: 0 0 10px 0;
      font-weight: 600;
    }
    .header-section p {
      color: #666;
      margin: 0;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 25px;
      position: relative;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      z-index: 1;
    }
    .form-group input {
      width: 100%;
      padding: 15px 15px 15px 45px;
      border: 2px solid #e1e5e9;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }
    .form-group input:focus {
      outline: none;
      border-color: #274293;
      background: white;
      box-shadow: 0 0 0 3px rgba(39, 66, 147, 0.1);
    }
    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #274293, #1e3275);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(39, 66, 147, 0.3);
    }
    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .submit-btn .spinner {
      display: none;
      margin-right: 10px;
    }
    .submit-btn.loading .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .back-link {
      text-align: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e1e5e9;
    }
    .back-link a {
      color: #274293;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      transition: all 0.3s ease;
    }
    .back-link a:hover {
      color: #1e3275;
      transform: translateX(-3px);
    }
    .back-link a i {
      margin-right: 8px;
    }
    .alert {
      padding: 12px 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      font-weight: 500;
      display: flex;
      align-items: center;
    }
    .alert i {
      margin-right: 10px;
      font-size: 18px;
    }
    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .alert-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .alert-info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    @media (max-width: 480px) {
      .forgot-container {
        padding: 30px 20px;
        margin: 10px;
      }
      .header-section i {
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="forgot-container">
    <div class="header-section">
      <i class="fas fa-key"></i>
      <h2>Forgot Password?</h2>
      <p>No worries! Enter your email address and we'll send you a link to reset your password.</p>
    </div>
    
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=True) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'error' if category == 'error' else 'success' if category == 'success' else 'info' }}">
            <i class="fas fa-{{ 'exclamation-circle' if category == 'error' else 'check-circle' if category == 'success' else 'info-circle' }}"></i>
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <form id="forgotPasswordForm" action="{{ url_for('forgot_password') }}" method="POST">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" id="email" placeholder="Enter your registered email" required />
        </div>
      </div>
      
      <button type="submit" class="submit-btn" id="submitBtn">
        <i class="fas fa-spinner spinner"></i>
        <span class="btn-text">Send Reset Link</span>
      </button>
    </form>
    
    <div class="back-link">
      <a href="{{ url_for('login') }}">
        <i class="fas fa-arrow-left"></i>
        Back to Login
      </a>
    </div>
  </div>

  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
      const submitBtn = document.getElementById('submitBtn');
      const btnText = submitBtn.querySelector('.btn-text');
      
      // Show loading state
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      btnText.textContent = 'Sending...';
      
      // Form will submit normally, but we show loading state
      // The server will handle the response and redirect
    });

    // Email validation
    document.getElementById('email').addEventListener('input', function() {
      const email = this.value;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      
      if (email && !emailRegex.test(email)) {
        this.setCustomValidity('Please enter a valid email address');
      } else {
        this.setCustomValidity('');
      }
    });

    // Auto-focus email field
    document.getElementById('email').focus();
  </script>
</body>
</html>
