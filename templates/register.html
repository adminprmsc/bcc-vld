<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Registration</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px 0;
    }
    .registration-container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      overflow: hidden;
      max-width: 1200px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      margin: 20px;
    }
    .registration-image {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 100, 100, 0.6)), url("static/images/registration-form.png") no-repeat center center;
      background-size: cover;
      flex: 1 1 40%;
      min-height: 400px;
      color: white;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .registration-form {
      flex: 1 1 60%;
      padding: 40px;
      min-width: 300px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-control:focus {
      border-color: #00b894;
      box-shadow: none;
    }
    .form-icon {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #1f2937;
      z-index: 2;
    }
    .form-control {
      padding-left: 40px;
      height: 45px;
      border-radius: 6px;
    }
    .form-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .form-row .form-group {
      flex: 1;
      min-width: 250px;
    }
    .submit-btn {
      background-color: #1f2937;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 0.375rem;
      transition: background-color 0.3s ease;
      width: 100%;
      margin-top: 20px;
    }
    .submit-btn:hover {
      background-color: #111827;
    }
    /* Logo section responsive */
    .logo-section {
      text-align: center;
      margin-bottom: 2rem;
      padding: 1rem;
    }
    .logo-section img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 15px auto;
    }
    /* Responsive breakpoints */
    @media (max-width: 1200px) {
      .logo-section img {
        width: 400px;
      }
      
      .registration-container {
        max-width: 1000px;
      }
    }
    @media (max-width: 992px) {
      .logo-section img {
        width: 350px;
      }
      
      .registration-container {
        flex-direction: column;
        margin: 10px;
      }
      
      .registration-image {
        flex: 1 1 100%;
        min-height: 300px;
        order: 1;
      }
      
      .registration-form {
        flex: 1 1 100%;
        padding: 30px;
        order: 2;
      }
      
      .form-row {
        flex-direction: column;
        gap: 0;
      }
      
      .form-row .form-group {
        min-width: 100%;
      }
    }
    @media (max-width: 768px) {
      body {
        padding: 10px 0;
      }
      
      .logo-section {
        margin-bottom: 1rem;
        padding: 0.5rem;
      }
      
      .logo-section img {
        width: 280px;
      }
      
      .registration-container {
        margin: 5px;
        border-radius: 8px;
      }
      
      .registration-image {
        min-height: 250px;
        padding: 1.5rem;
      }
      
      .registration-image h1 {
        font-size: 1.5rem !important;
      }
      
      .registration-image h2 {
        font-size: 1.25rem !important;
      }
      
      .registration-image p {
        font-size: 0.9rem !important;
      }
      
      .registration-form {
        padding: 20px;
      }
      
      .registration-form h2 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
      }
      
      .form-control {
        height: 50px;
        font-size: 16px; /* Prevents zoom on iOS */
      }
      
      .form-icon {
        top: 15px;
        left: 15px;
      }
      
      .form-control {
        padding-left: 45px;
      }
    }
    @media (max-width: 576px) {
      .logo-section img {
        width: 240px;
      }
      
      .registration-container {
        margin: 0;
        border-radius: 0;
        min-height: 100vh;
      }
      
      .registration-image {
        min-height: 200px;
        padding: 1rem;
      }
      
      .registration-image h1 {
        font-size: 1.25rem !important;
      }
      
      .registration-image h2 {
        font-size: 1.1rem !important;
      }
      
      .registration-image p {
        font-size: 0.85rem !important;
        margin-top: 1rem !important;
      }
      
      .registration-form {
        padding: 15px;
      }
      
      .registration-form h2 {
        font-size: 1.25rem;
        margin-bottom: 1rem;
      }
      
      .form-group {
        margin-bottom: 15px;
      }
      
      .submit-btn {
        padding: 1rem 1.5rem;
        font-size: 1.1rem;
      }
    }
    @media (max-width: 400px) {
      .logo-section img {
        width: 200px;
      }
      
      .registration-form {
        padding: 10px;
      }
      
      .form-control {
        padding-left: 40px;
      }
      
      .form-icon {
        left: 12px;
      }
    }
    /* Landscape orientation on mobile */
    @media (max-height: 600px) and (orientation: landscape) {
      body {
        align-items: flex-start;
        padding: 10px 0;
      }
      
      .logo-section {
        display: none;
      }
      
      .registration-container {
        margin: 10px;
        flex-direction: row;
      }
      
      .registration-image {
        flex: 1 1 35%;
        min-height: auto;
      }
      
      .registration-form {
        flex: 1 1 65%;
        padding: 20px;
      }
    }
    /* Print styles */
    @media print {
      .registration-image {
        display: none;
      }
      
      .registration-form {
        flex: 1 1 100%;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container-fluid p-0">
    <!-- Logo section with responsive classes -->
    <div class="logo-section d-none d-sm-block">
      <img src="{{ url_for('static', filename='assets/img/icons/logo.svg') }}" alt="Logo" 
           class="img-fluid">
      
      <img src="{{ url_for('static', filename='assets/img/icons/prmsc.svg') }}" alt="PRMSC" 
           class="img-fluid">
      
      <img src="{{ url_for('static', filename='assets/img/icons/tagline.svg') }}" alt="Tagline" 
           class="img-fluid">
    </div>

    <div class="d-flex justify-content-center align-items-center min-vh-10">
      <div class="registration-container">
        <div class="registration-image d-flex align-items-center justify-content-center text-white text-center">
          <div>
            <h2 class="fw-bold">Welcome to</h2>
            <h1 class="display-6 fw-bold">Land Donation System</h1>
            <p class="mt-3 lead">
              Join our mission to build a better future through land donations. Register now to contribute, collaborate, and create impact.
            </p>
          </div>
        </div>
        <div class="registration-form">
          <h2 class="text-center mb-4 fw-bold" style="color: #1f2937;">
            User Registration
          </h2>

          <form action="{{ url_for('register') }}" method="POST" enctype="multipart/form-data">
            <!-- Name and Email Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-user form-icon"></i>
                <input type="text" class="form-control" name="name" placeholder="Full Name" required>
              </div>
              <div class="form-group position-relative">
                <i class="fas fa-envelope form-icon"></i>
                <input type="email" class="form-control" name="email" id="email" placeholder="Email Address" required>
              </div>
            </div>
            
            <!-- Phone and Birth Date Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-phone form-icon"></i>
                <input type="tel" class="form-control" name="phone" placeholder="Phone Number" required>
              </div>
              <div class="form-group position-relative">
                <i class="fas fa-calendar-alt form-icon"></i>
                <input type="date" class="form-control" name="birth_date" required>
              </div>
            </div>
            
            <!-- Region and District Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-map-marker-alt form-icon"></i>
                <select class="form-control" name="region" id="region" required>
                  <option value="">Select Region</option>
                  <option value="South-I">South-I</option>
                  <option value="South-II">South-II</option>
                  <option value="South-III">South-III</option>
                  <option value="North">North</option>
                  <option value="Centre-I">Centre-I</option>
                  <option value="Centre-II">Centre-II</option>
                </select>
              </div>
              <div class="form-group position-relative">
                <i class="fas fa-building form-icon"></i>
                <select class="form-control" name="district" id="district" required disabled>
                  <option value="">Select District</option>
                </select>
              </div>
            </div>

            <!-- Tehsil and Village Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-map form-icon"></i>
                <select class="form-control" name="tehsil" id="tehsil" required disabled>
                  <option value="">Select Tehsil</option>
                </select>
              </div>
              <div class="form-group position-relative">
                <i class="fas fa-home form-icon"></i>
                <select class="form-control" name="village" id="village" required disabled>
                  <option value="">Select Village</option>
                </select>
              </div>
            </div>

            <!-- Hidden fields -->
            <input type="hidden" name="village_code" id="village_code">
            <input type="hidden" name="village_latitude" id="village_latitude">
            <input type="hidden" name="village_longitude" id="village_longitude">
            
            <!-- Address Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-home form-icon"></i>
                <input type="text" class="form-control" name="address_line1" placeholder="Address Line 1" required>
              </div>
            </div>
            
            <!-- Designation Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-briefcase form-icon"></i>
                <select class="form-control" name="designation" required>
                  <option value="" disabled selected>Select Designation</option>
                  <option>BCC Officer</option>
                  <option>EDCS Person</option>
                  <option>Deputy Manager</option>
                  <option>Tehsil Manager</option>
                  <option>BCC Specialist</option>
                </select>
              </div>
              <div class="form-group position-relative">
                <i class="fas fa-venus-mars form-icon" style="color: #1f2937;"></i>
                <select class="form-control" name="gender" required>
                  <option value="" disabled selected>Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                  <option>Prefer not to say</option>
                </select>
              </div>
            </div>
            
            <!-- CNIC Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-id-card form-icon"></i>
                <input type="text" class="form-control" name="cnic" placeholder="CNIC / National ID (Optional)">
              </div>
            </div>
            
            <!-- Password Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-lock form-icon"></i>
                <input type="password" class="form-control" name="password" placeholder="Password" required>
              </div>
              <div class="form-group position-relative">
                <i class="fas fa-lock form-icon"></i>
                <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password" required>
              </div>
            </div>
            
            <!-- Profile Picture Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-image form-icon"></i>
                <input type="file" class="form-control" name="profile_picture" accept="image/*">
              </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn submit-btn">Register</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Flash messages handling -->
  <script>
    // Handle form submission success
    document.querySelector('form').addEventListener('submit', function(e) {
        // Show loading state
        const submitBtn = document.querySelector('.submit-btn button');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Registering...';
        submitBtn.disabled = true;
        
        // Remove this line to allow actual form submission
        // e.preventDefault();
    });
  </script>
  
  <!-- Add email validation script -->
  <script>
  document.getElementById('email').addEventListener('blur', function() {
      const email = this.value;
      if (email) {
          fetch(`/api/check-email?email=${encodeURIComponent(email)}`)
              .then(response => response.json())
              .then(data => {
                  if (data.exists) {
                      this.setCustomValidity('Email already registered');
                      this.reportValidity();
                  } else {
                      this.setCustomValidity('');
                  }
              });
      }
  });
  </script>

  // Event handlers for cascading dropdowns
  document.getElementById('region').addEventListener('change', function() {
    const region = this.value;
    const districtSelect = document.getElementById('district');
    const tehsilSelect = document.getElementById('tehsil');
    const villageSelect = document.getElementById('village');
    
    // Reset dependent dropdowns
    districtSelect.innerHTML = '<option value="">Select District</option>';
    tehsilSelect.innerHTML = '<option value="">Select Tehsil</option>';
    villageSelect.innerHTML = '<option value="">Select Village</option>';
    
    districtSelect.disabled = true;
    tehsilSelect.disabled = true;
    villageSelect.disabled = true;
    
    if (region && villageData[region]) {
      const districts = Object.keys(villageData[region]);
      districts.forEach(district => {
        const option = document.createElement('option');
        option.value = district;
        option.textContent = district;
        districtSelect.appendChild(option);
      });
      districtSelect.disabled = false;
    }
  });

  document.getElementById('district').addEventListener('change', function() {
    const region = document.getElementById('region').value;
    const district = this.value;
    const tehsilSelect = document.getElementById('tehsil');
    const villageSelect = document.getElementById('village');
    
    // Reset dependent dropdowns
    tehsilSelect.innerHTML = '<option value="">Select Tehsil</option>';
    villageSelect.innerHTML = '<option value="">Select Village</option>';
    
    tehsilSelect.disabled = true;
    villageSelect.disabled = true;
    
    if (region && district && villageData[region][district]) {
      const tehsils = Object.keys(villageData[region][district]);
      tehsils.forEach(tehsil => {
        const option = document.createElement('option');
        option.value = tehsil;
        option.textContent = tehsil;
        tehsilSelect.appendChild(option);
      });
      tehsilSelect.disabled = false;
    }
  });

  document.getElementById('tehsil').addEventListener('change', function() {
    const region = document.getElementById('region').value;
    const district = document.getElementById('district').value;
    const tehsil = this.value;
    const villageSelect = document.getElementById('village');
    
    // Reset village dropdown
    villageSelect.innerHTML = '<option value="">Select Village</option>';
    villageSelect.disabled = true;
    
    if (region && district && tehsil && villageData[region][district][tehsil]) {
      const villages = villageData[region][district][tehsil];
      villages.forEach(village => {
        const option = document.createElement('option');
        option.value = village.name;
        option.dataset.code = village.code;
        option.dataset.lat = village.lat;
        option.dataset.lng = village.lng;
        option.textContent = village.name;
        villageSelect.appendChild(option);
      });
      villageSelect.disabled = false;
    }
  });

  document.getElementById('village').addEventListener('change', function() {
    const selectedOption = this.options[this.selectedIndex];
    
    if (selectedOption.dataset.code) {
      document.getElementById('village_code').value = selectedOption.dataset.code;
      document.getElementById('village_latitude').value = selectedOption.dataset.lat;
      document.getElementById('village_longitude').value = selectedOption.dataset.lng;
    }
  });
  </script>
