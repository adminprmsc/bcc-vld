# Edge nginx — single origin for SPA + API (eliminates browser CORS)
# Replace YOUR_DOMAIN with your Nayatel hostname before going live.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream lds_frontend {
    server frontend:80;
}

upstream lds_backend {
    server backend:3000;
}

# HTTP — redirect to HTTPS when certificates are present; serve ACME challenge
server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
    }

    # Uncomment after SSL certificates are installed (see DEPLOYMENT.md)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Until SSL is configured, proxy everything on port 80
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://lds_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://lds_backend/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://lds_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

