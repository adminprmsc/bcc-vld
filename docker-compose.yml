# LDS Production Stack — PostgreSQL + Backend + Frontend (nginx)
# Local: ./deploy/local.sh up  |  Production: ./deploy/production.sh deploy

services:
  postgres:
    image: postgres:16-alpine
    container_name: lds-postgres
    restart: unless-stopped
    command: postgres -c timezone=Asia/Karachi
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lds_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-lds_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lds-internal
    # POSTGRES_PORT = host port (e.g. 3306 on production VM); container always listens on 5432
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-3306}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lds_user} -d ${POSTGRES_DB:-lds_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lds-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lds_db}
      POSTGRES_USER: ${POSTGRES_USER:-lds_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      AUDIT_READS: ${AUDIT_READS:-false}
      REQUIRE_STRONG_ADMIN_PASSWORD: ${REQUIRE_STRONG_ADMIN_PASSWORD:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@lds.gov.pk}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - lds-internal
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lds-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lds-internal
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: lds-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/lds.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - lds-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
  certbot_www:
  certbot_conf:

networks:
  lds-internal:
    driver: bridge
